name: Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'optimisation/**'
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Observable
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          path: ESPressio-Observable
      - name: Configure
        run: >-
          cmake -S tests -B build
          -DESPRESSIO_OBSERVABLE_DIR=${{ github.workspace }}/ESPressio-Observable/src
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  esp32-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - name: Create core integration project
        run: |
          mkdir -p /tmp/state-core/src
          cat > /tmp/state-core/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          lib_deps =
              file://${{ github.workspace }}
          build_unflags =
              -std=gnu++11
              -fno-rtti
          build_flags =
              -std=gnu++17
              -frtti
          EOF
          cat > /tmp/state-core/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_State.hpp>
          #define ESPRESSIO_STATE_ENABLE_INTROSPECTION 0
          #define ESPRESSIO_STATE_ENABLE_SERIALIZATION 0
          #include <ESPressio_StateIntrospection.hpp>
          #include <ESPressio_StateSerialization.hpp>
          struct LedState { using Value = bool; static constexpr ESPressio::State::StateTypeId Id = 1; };
          using Contract = ESPressio::State::StateContract<LedState>;
          ESPressio::State::RemoteStateManager<Contract, 2> remoteState;
          ESPressio::State::StatePublisher<Contract> publisher;
          void setup() {}
          void loop() {}
          EOF
      - run: pio run -d /tmp/state-core

  esp32-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - name: Create diagnostic integration project
        run: |
          mkdir -p /tmp/state-diagnostics/src
          cat > /tmp/state-diagnostics/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          lib_deps =
              file://${{ github.workspace }}
          build_unflags =
              -std=gnu++11
              -fno-rtti
          build_flags =
              -std=gnu++17
              -frtti
          EOF
          cat > /tmp/state-diagnostics/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_State.hpp>
          #include <ESPressio_StateIntrospection.hpp>
          #include <ESPressio_StateSerialization.hpp>

          struct LedState {
              using Value = bool;
              static constexpr ESPressio::State::StateTypeId Id = 1;
              static constexpr const char* Name = "led.enabled";
          };
          struct CounterState {
              using Value = uint32_t;
              static constexpr ESPressio::State::StateTypeId Id = 2;
          };
          using Contract = ESPressio::State::StateContract<LedState, CounterState>;
          ESPressio::State::RemoteStateManager<Contract, 2> remoteState;

          void setup() {
              const uint8_t mac[6] = {1, 2, 3, 4, 5, 6};
              const auto device = ESPressio::State::DeviceIdentifier::FromMacAddress(mac);
              remoteState.Apply<LedState>(device, 1, 1, true);
              remoteState.Apply<CounterState>(device, 1, 1, 42);

              const char* name = nullptr;
              ESPressio::State::StateIntrospection<Contract>::TryGetName(
                  LedState::Id,
                  name
              );

              ESPressio::State::StateSerialization<Contract>::ForEachRemoteState(
                  remoteState,
                  [](const auto& record) {
                      (void)record.TypeId;
                      (void)record.PayloadSize;
                  }
              );
          }
          void loop() {}
          EOF
      - run: pio run -d /tmp/state-diagnostics

  esp32-observer-thread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - name: Create observer integration project
        run: |
          mkdir -p /tmp/state-observer/src
          cat > /tmp/state-observer/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          lib_deps =
              file://${{ github.workspace }}
              https://github.com/ESPressio-Development-Platform/ESPressio-Threads.git#optimisation/69-resource-footprint
          build_unflags =
              -std=gnu++11
              -fno-rtti
          build_flags =
              -std=gnu++17
              -frtti
          EOF
          cat > /tmp/state-observer/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_State.hpp>
          #include <ESPressio_RemoteStateObserverThread.hpp>

          struct LedState {
              using Value = bool;
              static constexpr ESPressio::State::StateTypeId Id = 1;
          };
          using Contract = ESPressio::State::StateContract<LedState>;

          class LedObserver final :
              public ESPressio::State::IRemoteStateObserver<LedState>,
              public ESPressio::State::IRemoteDeviceAvailabilityObserver {
          public:
              void OnRemoteStateChanged(
                  ESPressio::State::StateTag<LedState>,
                  const ESPressio::State::DeviceIdentifier&,
                  bool hasPreviousValue,
                  const bool& previousValue,
                  const bool& latestValue,
                  ESPressio::State::StateEpoch,
                  ESPressio::State::StateRevision,
                  ESPressio::State::RemoteDeviceAvailability
              ) override {
                  (void)hasPreviousValue;
                  (void)previousValue;
                  (void)latestValue;
              }

              void OnRemoteDeviceAvailabilityChanged(
                  const ESPressio::State::DeviceIdentifier&,
                  ESPressio::State::RemoteDeviceAvailability,
                  ESPressio::State::RemoteDeviceAvailability
              ) override {}
          };

          ESPressio::State::RemoteStateManager<Contract, 2> remoteState;
          ESPressio::State::RemoteStateObserverThread<Contract, 2> observerThread(remoteState);
          LedObserver observer;
          ESPressio::Observable::ObserverHandlePtr observerHandle;

          void setup() {
              observerHandle = observerThread.RegisterStateObserver<LedState>(&observer);
              observerThread.Prepare();
          }
          void loop() {}
          EOF
      - run: pio run -d /tmp/state-observer
