name: State typed architecture contracts
on:
  push:
    branches: [primitives_redesign]
  pull_request:
jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: primitives_redesign, path: deps/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Primitive, ref: primitives_redesign, path: deps/ESPressio-Primitive}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: primitives_redesign, path: deps/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: primitives_redesign, path: deps/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: primitives_redesign, path: deps/ESPressio-Timing}
      - name: Configure typed State contracts
        run: cmake -S tests -B build -DESPRESSIO_DEPENDENCIES="$GITHUB_WORKSPACE/deps"
      - name: Build typed State contracts
        run: cmake --build build --parallel
      - name: Run typed State contracts
        run: ctest --test-dir build --output-on-failure
  esp32-typed-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - name: Compile typed State surface without RTTI
        run: |
          mkdir -p /tmp/state-typed/src
          cat > /tmp/state-typed/platformio.ini <<'PIO'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          lib_deps =
              file://${{ github.workspace }}
              https://github.com/ESPressio-Development-Platform/ESPressio-System.git#primitives_redesign
              https://github.com/ESPressio-Development-Platform/ESPressio-Primitive.git#primitives_redesign
              https://github.com/ESPressio-Development-Platform/ESPressio-Units.git#primitives_redesign
              https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git#primitives_redesign
              https://github.com/ESPressio-Development-Platform/ESPressio-Timing.git#primitives_redesign
          build_unflags = -std=gnu++11 -frtti
          build_flags = -std=gnu++17 -fno-rtti
          PIO
          cat > /tmp/state-typed/src/main.cpp <<'CPP'
          #include <Arduino.h>
          #include <ESPressio_States.hpp>
          #include <ESPressio_TypeDirectory.hpp>
          struct LedState final : ESPressio::State::State<LedState,bool> {
              static constexpr ESPressio::State::StateTypeId TypeId{1};
              static constexpr const char* CanonicalName="Demo.State.Led";
          };
          using States=ESPressio::State::Runtime<ESPressio::State::TypeConfiguration<LedState>>;
          ESPressio::Primitive::TypeDirectory<1> directory;
          States states;
          void setup(){ (void)directory.Register<LedState>();(void)directory.Initialize(); }
          void loop(){}
          CPP
          pio run -d /tmp/state-typed
