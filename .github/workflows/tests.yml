name: Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'optimisation/**'
      - 'structural_realignment_propagation_ESPressio-Mesh'
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout System propagation branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-System
      - name: Checkout Observable working branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: structural_realignment
          path: ESPressio-Observable
      - name: Configure
        run: >-
          cmake -S tests -B build
          -DESPRESSIO_SYSTEM_DIR=${{ github.workspace }}/ESPressio-System/src
          -DESPRESSIO_OBSERVABLE_DIR=${{ github.workspace }}/ESPressio-Observable/src
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  esp32-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - name: Create RTTI-free core integration project
        run: |
          mkdir -p /tmp/state-core/src
          cat > /tmp/state-core/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          lib_deps =
              file://${{ github.workspace }}
              https://github.com/ESPressio-Development-Platform/ESPressio-System.git#structural_realignment_propagation_ESPressio-Mesh
              https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git#structural_realignment
          build_unflags = -std=gnu++11
          build_flags = -std=gnu++17 -fno-rtti
          EOF
          cat > /tmp/state-core/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_State.hpp>
          #define ESPRESSIO_STATE_ENABLE_INTROSPECTION 0
          #define ESPRESSIO_STATE_ENABLE_SERIALIZATION 0
          #include <ESPressio_StateIntrospection.hpp>
          #include <ESPressio_StateSerialization.hpp>
          struct LedState { using Value = bool; static constexpr ESPressio::State::StateTypeId Id = 1; };
          using Contract = ESPressio::State::StateContract<LedState>;
          ESPressio::State::RemoteStateManager<Contract, 2> remoteState;
          ESPressio::State::StatePublisher<Contract> publisher;
          void setup() {}
          void loop() {}
          EOF
      - run: pio run -d /tmp/state-core

  esp32-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - name: Create RTTI-free diagnostic integration project
        run: |
          mkdir -p /tmp/state-diagnostics/src
          cat > /tmp/state-diagnostics/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          lib_deps =
              file://${{ github.workspace }}
              https://github.com/ESPressio-Development-Platform/ESPressio-System.git#structural_realignment_propagation_ESPressio-Mesh
              https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git#structural_realignment
          build_unflags = -std=gnu++11
          build_flags = -std=gnu++17 -fno-rtti
          EOF
          cat > /tmp/state-diagnostics/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_State.hpp>
          #include <ESPressio_StateIntrospection.hpp>
          #include <ESPressio_StateSerialization.hpp>
          struct LedState { using Value = bool; static constexpr ESPressio::State::StateTypeId Id = 1; static constexpr const char* Name = "led.enabled"; };
          struct CounterState { using Value = uint32_t; static constexpr ESPressio::State::StateTypeId Id = 2; };
          using Contract = ESPressio::State::StateContract<LedState, CounterState>;
          ESPressio::State::RemoteStateManager<Contract, 2> remoteState;
          void setup() {
              ESPressio::State::DeviceIdentifier::Storage identity{};
              identity[15] = 1;
              const ESPressio::State::DeviceIdentifier device(identity);
              remoteState.SetReachability(device, ESPressio::State::StateSourceReachability::Reachable);
              remoteState.Apply<LedState>(device,1,1,true);
              remoteState.Apply<CounterState>(device,1,1,42);
              const char* name = nullptr;
              ESPressio::State::StateIntrospection<Contract>::TryGetName(LedState::Id,name);
              ESPressio::State::StateSerialization<Contract>::ForEachRemoteState(remoteState,[](const auto& record){ (void)record.TypeId; (void)record.PayloadSize; (void)record.Availability; (void)record.Reachability; });
          }
          void loop() {}
          EOF
      - run: pio run -d /tmp/state-diagnostics

  esp32-observer-thread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - name: Create RTTI-free observer integration project
        run: |
          mkdir -p /tmp/state-observer/src
          cat > /tmp/state-observer/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          lib_deps =
              file://${{ github.workspace }}
              https://github.com/ESPressio-Development-Platform/ESPressio-System.git#structural_realignment_propagation_ESPressio-Mesh
              https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Units.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Timing.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Threads.git#structural_realignment
          build_unflags = -std=gnu++11 -frtti
          build_flags = -std=gnu++17 -fno-rtti
          EOF
          cat > /tmp/state-observer/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_State.hpp>
          #include <ESPressio_RemoteStateObserverThread.hpp>
          struct LedState { using Value = bool; static constexpr ESPressio::State::StateTypeId Id = 1; };
          using Contract = ESPressio::State::StateContract<LedState>;
          class LedObserver final : public ESPressio::State::IRemoteStateObserver<LedState>, public ESPressio::State::IRemoteStateAvailabilityObserver, public ESPressio::State::IRemoteStateReachabilityObserver {
          public:
              void OnRemoteStateChanged(ESPressio::State::StateTag<LedState>, const ESPressio::State::DeviceIdentifier&, bool hasPreviousValue, const bool& previousValue, const bool& latestValue, ESPressio::State::StateEpoch, ESPressio::State::StateRevision, ESPressio::State::StateAvailabilityStatus) override { (void)hasPreviousValue; (void)previousValue; (void)latestValue; }
              void OnRemoteStateAvailabilityChanged(const ESPressio::State::StateAddress&, ESPressio::State::StateAvailabilityStatus, ESPressio::State::StateAvailabilityStatus) override {}
              void OnRemoteStateReachabilityChanged(const ESPressio::State::DeviceIdentifier&, ESPressio::State::StateSourceReachability, ESPressio::State::StateSourceReachability) override {}
          };
          ESPressio::State::RemoteStateManager<Contract,2> remoteState;
          ESPressio::State::RemoteStateObserverThread<Contract,2> observerThread(remoteState);
          LedObserver observer;
          ESPressio::Observable::ObserverHandlePtr stateObserverHandle;
          ESPressio::Observable::ObserverHandlePtr availabilityObserverHandle;
          ESPressio::Observable::ObserverHandlePtr reachabilityObserverHandle;
          void setup(){ stateObserverHandle=observerThread.RegisterStateObserver<LedState>(&observer); availabilityObserverHandle=observerThread.RegisterAvailabilityObserver(&observer); reachabilityObserverHandle=observerThread.RegisterReachabilityObserver(&observer); observerThread.Prepare(); }
          void loop() {}
          EOF
      - run: pio run -d /tmp/state-observer
